[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitomb"
version = "0.1.0"
description = "Review, retire, and restore local Git branches and stashes with Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15", "typesafe-sdk>=0.7.1,<0.8", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.scripts]
gitomb = "gitomb.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
